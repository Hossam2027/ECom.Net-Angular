<div class="container-fluid mt-5 px-4">

  <!-- Page Title -->
  <div class="row mb-4">
    <div class="col">
      <h1 class="main-title">Shopping</h1>
    </div>
  </div>

  <div class="row">

    <!-- Sidebar -->
    <aside class="col-lg-3 mb-4">
      <div class="sidebar">

        <!-- Sorting -->
        <h4 class="section-title">Sorting</h4>

        <div class="mb-4">
          <select class="form-select" (change)="onSortChange($event)">
            <option value="Name">Name</option>
            <option value="PriceAsc">Price: Low → High</option>
            <option value="PriceAsn">Price: High → Low</option>
          </select>
        </div>

        <!-- Categories -->
        <h4 class="section-title">Categories</h4>

        <ul class="list-group custom-list-group">
          <li
            class="list-group-item custom-list-item"
            (click)="filterByCategory(0)">
            All
          </li>

          <li
            *ngFor="let category of categories"
            class="list-group-item custom-list-item"
            (click)="filterByCategory(category.id)">
            {{ category.name }}
          </li>
        </ul>

      </div>
    </aside>

    <!-- Products -->
    <section class="col-lg-9">

      <!-- Top Bar -->
      <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">

        <!-- Pagination Info -->
        <div>
          <span class="fw-semibold">
            Showing {{ startItem }} - {{ endItem }} of {{ totalItems }} products
          </span>
        </div>

        <!-- Search -->
        <!-- <div class="input-group" style="max-width:450px;">

          <input
            type="text"
            class="form-control"
            placeholder="Search products..."
            [(ngModel)]="searchText"
            (input)="filterBySearch()">

          <button
            class="btn btn-danger"
            (click)="filterBySearch()">
            Search
          </button>

          <button
            class="btn btn-outline-dark"
            (click)="resetSearch()">
            Reset
          </button>

        </div> -->

      </div>

      <!-- Products Grid -->
      <div class="row g-4">

        <div
          class="col-xl-4 col-lg-6 col-md-6"
          *ngFor="let product of pagedProducts">

          <app-shop-item
            [product]="product">
          </app-shop-item>

        </div>

      </div>

      <!-- Pagination -->
      <div class="d-flex justify-content-center mt-5">

        <pagination
          [totalItems]="totalItems"
          [(ngModel)]="currentPage"
          [itemsPerPage]="itemsPerPage"
          (pageChanged)="onPageChange($event)"
          [boundaryLinks]="true"
          [maxSize]="5"
          previousText="«"
          nextText="»"
          firstText="First"
          lastText="Last">
        </pagination>

      </div>

    </section>

  </div>

</div>
