<nav class="navbar navbar-expand-lg custom-nav sticky-top">

    <div class="container">

        <!-- Logo -->
        <a class="navbar-brand"
        >
            <i class="  " >🛍️</i>
            <span>ECom - Online Store</span>
        </a>
        

        <button
            class="navbar-toggler"
            type="button"
            (click)="isMenuOpen=!isMenuOpen">

            <i class="fa-solid fa-bars"></i>

        </button>

        <div class="collapse navbar-collapse"
             [class.show]="isMenuOpen">

            <!-- Menu -->

            <ul class="navbar-nav">

                <li class="nav-item">
                    <a routerLink="/home"
                       routerLinkActive="active"
                       class="nav-link">

                        <i class="fa-solid fa-house"></i>
                        Home

                    </a>
                </li>

                <li class="nav-item">

                    <a routerLink="/shop"
                       routerLinkActive="active"
                       class="nav-link">

                        <i class="fa-solid fa-store"></i>
                        Shop

                    </a>

                </li>

            </ul>

            <!-- Search -->

            <div
                *ngIf="showSearch"
                class="search-box">

                <i class="fa-solid fa-magnifying-glass"></i>

                <input
                    type="text"
                    placeholder="Search products..."
                    [(ngModel)]="searchText"
                    (input)="filterBySearch()">

                <button (click)="resetSearch()">

                    <i class="fa-solid fa-xmark"></i>

                </button>

            </div>
        <span class="nav-item"><a class="nav-link" href="#">Welcome {{username}}</a></span>

            <!-- Right -->

            <div class="right-icons">

                <a routerLink="/basket" class="cart">

                    <i class="fa-solid fa-cart-shopping"
                       [matBadge]="count$|async"
                       matBadgeColor="warn"></i>

                </a>

                <div class="dropdown"
                     (clickOutside)="visible=false">

                    <i class="fa-solid fa-circle-user user"
                       (click)="toggle($event)"></i>

                    <div
                        class="dropdown-menu dropdown-menu-end shadow"
                        [class.show]="visible">

                        <a 
                            *ngIf="!isLoggedIn()"
class="dropdown-item"
                           routerLink="/login">

                            <i class="fa-solid fa-right-to-bracket"></i>

                            Login

                        </a>

                        <a     *ngIf="!isLoggedIn()"

                        class="dropdown-item"
                           routerLink="/register">

                            <i class="fa-solid fa-user-plus"></i>

                            Register

                        </a>

                        <a class="dropdown-item"
                           routerLink="/orders">

                            <i class="fa-solid fa-box"></i>

                            Orders

                        </a>

                        <hr>

                        <a
                            *ngIf="isLoggedIn()"

                           class="dropdown-item text-danger"
                           (click)="logout()">

                            <i class="fa-solid fa-arrow-right-from-bracket"></i>

                            Logout

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</nav>
