<section class="pt-5">
    <div class="container">
        <div class="row">
            <div class="col-md-5 mx-auto">

                <div class="card shadow border-0 rounded-4">
                    <div class="card-body p-4">

                        <h3 class="text-center mb-4">Login</h3>

                        <form [formGroup]="formgroup" (ngSubmit)="submit()">

                            <!-- Email -->
                            <div class="mb-3">

                                <label for="Email" class="form-label">
                                    Email
                                </label>

                                <input type="Email" id="Email" formControlName="Email" class="form-control"
                                    [class.is-invalid]="
                                    formgroup.get('Email')?.invalid &&
                                    (formgroup.get('Email')?.touched ||
                                    formgroup.get('Email')?.dirty)" />

                                <div *ngIf="
                                    formgroup.get('Email')?.invalid &&
                                    (formgroup.get('Email')?.touched ||
                                    formgroup.get('Email')?.dirty)" class="invalid-feedback">

                                    <div *ngIf="formgroup.get('Email')?.errors?.['required']">
                                        Email is required.
                                    </div>

                                    <div *ngIf="formgroup.get('Email')?.errors?.['Email']">
                                        Please enter valid email.
                                    </div>

                                </div>

                            </div>

                            <!-- Password -->
                            <!-- Password -->
                            <div class="mb-3">

                                <label for="Password" class="form-label">
                                    Password
                                </label>

                                <div class="position-relative">

                                    <input [type]="showPassword ? 'text' : 'password'" id="Password"
                                        formControlName="Password" class="form-control pe-5" [class.is-invalid]="
            formgroup.get('Password')?.invalid &&
            (formgroup.get('Password')?.touched ||
            formgroup.get('Password')?.dirty)" />

                                    <!-- Eye Button -->
                                    <button type="button"
                                        class="btn btn-sm position-absolute top-50 end-0 translate-middle-y me-2"
                                        (click)="togglePassword()">

                                        {{ showPassword ? '🙈' : '👁️' }}

                                    </button>

                                </div>

                                <div *ngIf="
        formgroup.get('Password')?.invalid &&
        (formgroup.get('Password')?.touched ||
        formgroup.get('Password')?.dirty)" class="invalid-feedback d-block">

                                    <div *ngIf="formgroup.get('Password')?.errors?.['required']">
                                        Password is required.
                                    </div>

                                    <div *ngIf="formgroup.get('Password')?.errors?.['minlength']">
                                        Password must be at least 6 characters.
                                    </div>

                                </div>

                            </div>

                            <!-- Forgot Password -->
                            <div class="text-end mb-3">

                                <a routerLink="/forget-password" class="text-decoration-none">

                                    Forgot Password?

                                </a>


                            </div>

                            <!-- Login Button -->
                            <button type="submit" class="btn btn-primary w-100 rounded-3"
                                [disabled]="formgroup.invalid">

                                Login

                            </button>

                            <!-- Register -->
                            <div class="text-center mt-4">

                                <span class="text-muted">
                                    Don't have an account?
                                </span>

                                <a routerLink="/register" class="ms-1 text-decoration-none fw-bold">

                                    Register

                                </a>

                            </div>

                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>
</section>
