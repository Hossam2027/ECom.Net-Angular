<section class="pt-5">
    <div class="container">
        <div class="row">
        <div class="col-md-5 mx-auto">
            <div class="card card-body">
            <h3 class="text-center mb-4">Register</h3>
            <form [formGroup]="formgroup" (ngSubmit)="submit()" >

                <div class="mb-3" >
                <label for="name" class="form-label">Name</label>
                <input type="text" id=" name" formControlName="name" 
                [class.is-invalid]="name?.invalid && (name?.touched || name?.dirty)"
                class="form-control" />
                    <div *ngIf="name?.invalid && (name?.touched || name?.dirty)" class="invalid-feedback">
                        <div *ngIf="name?.errors?.['required']">Name is required.</div>
                        <div *ngIf="name?.errors?.['minlength']">Name must be at least 4 characters long.</div>
                    </div>
                </div>

                <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" formControlName="email" class="form-control"
                [class.is-invalid]="formgroup.get('email')?.invalid && (formgroup.get('email')?.touched || formgroup.get('email')?.dirty)"
                />
                <div *ngIf="formgroup.get('email')?.invalid && (formgroup.get('email')?.touched || formgroup.get('email')?.dirty)" class="invalid-feedback">
                    <div *ngIf="formgroup.get('email')?.errors?.['required']">Email is required.</div>
                    <div *ngIf="formgroup.get('email')?.errors?.['email']">Please enter a valid email address.</div>
                </div>
                </div>
                <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" formControlName="password" class="form-control"
                [class.is-invalid]="formgroup.get('password')?.invalid && (formgroup.get('password')?.touched || formgroup.get('password')?.dirty)"
                />
                <div *ngIf="formgroup.get('password')?.invalid && (formgroup.get('password')?.touched || formgroup.get('password')?.dirty)" class="invalid-feedback">
                    <div *ngIf="formgroup.get('password')?.errors?.['required']">Password is required.</div>
                    <div *ngIf="formgroup.get('password')?.errors?.['minlength']">Password must be at least 6 characters long.</div>
                </div>
                </div>
                <button type="submit" class="btn btn-primary w-100"
                    [disabled]="formgroup.invalid"
                >Register</button>
            </form>
            </div>
        </div>
        </div>
    </div>
