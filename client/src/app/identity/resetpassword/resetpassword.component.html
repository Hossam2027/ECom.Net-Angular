<div class="col-md-4 mx-auto mt-5">

    <div class="card shadow p-4">

        <h3 class="text-center mb-4">
            Reset Password
        </h3>

        <form (ngSubmit)="submit()" #form="ngForm">

            <!-- New Password -->
            <div class="mb-3">
                <label>New Password</label>
                <input type="password" class="form-control" [(ngModel)]="model.NewPassword" name="newPassword">
            </div>

            <!-- Confirm Password -->
            <div class="mb-3">
                <label>Confirm Password</label>
                <input type="password" class="form-control" [(ngModel)]="confirmPassword" name="confirmPassword">
            </div>

            <!-- Error message -->
            <div class="text-danger mb-2" *ngIf="passwordMismatch">
                Passwords do not match
            </div>

          <button type="submit"
        class="btn btn-success w-100"
        [disabled]="passwordMismatch">
    Reset Password
</button>

        </form>

    </div>

</div>
