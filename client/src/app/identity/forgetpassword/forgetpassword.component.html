<div class="container mt-5 w-50">

  <h2 class="mb-4">Forgot Password</h2>

  <form [formGroup]="form" (ngSubmit)="submit()">

    <div class="mb-3">

      <label>Email</label>

      <input
        type="email"
        class="form-control"
        formControlName="email"
        placeholder="Enter your email"
      >

    </div>

    <button
      class="btn btn-primary"
      type="submit"
      [disabled]="form.invalid"
    >
      Send Reset Link
    </button>

  </form>

</div>
